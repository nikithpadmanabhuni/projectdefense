<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:;" />
  <title>Profile Setup | ProjectDefense</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/custom.css" />
</head>
<body class="bg-[#0B0F17] text-[#E5E7EB] flex flex-col min-h-screen">

  <a href="#main-onboarding-content" class="sr-only focus:not-sr-only focus:p-2 focus:bg-blue-600 focus:text-white focus:absolute focus:top-2 focus:left-2 focus:z-50">Skip to content</a>

  <!-- Shared Header Navigation -->
  <div id="site-nav"></div>

  <!-- Main Content -->
  <main id="main-onboarding-content" class="flex-1 max-w-2xl w-full mx-auto px-4 sm:px-6 py-10 sm:py-14">
    
    <div class="bg-[#111827] border border-[#1F2937] rounded-xl p-6 sm:p-8 space-y-6">
      
      <!-- Page Header -->
      <header class="border-b border-[#1F2937] pb-5">
        <h1 class="text-2xl font-bold text-white tracking-tight">Student Profile Setup</h1>
        <p class="text-xs sm:text-sm text-slate-400 mt-1">
          Enter your current details to generate your practice baseline and readiness score.
        </p>
      </header>

      <!-- Global Status Notification (Live Region) -->
      <div id="form-status-message" class="hidden" aria-live="polite"></div>

      <!-- Onboarding Form -->
      <form id="onboarding-form" novalidate class="space-y-5">
        
        <!-- 1. Full Name -->
        <div>
          <label for="fullName" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
            Full Name <span class="text-red-400" aria-hidden="true">*</span>
          </label>
          <input 
            type="text" 
            id="fullName" 
            name="fullName"
            maxlength="60"
            placeholder="e.g. Rahul Sharma"
            class="w-full bg-[#0B0F17] border border-[#1F2937] rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none transition-smooth"
          />
          <p id="error-fullName" class="inline-error hidden text-xs text-red-400 mt-1.5" aria-live="polite"></p>
        </div>

        <!-- 2. College -->
        <div>
          <label for="college" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
            College Name <span class="text-slate-500 font-normal lowercase">(optional)</span>
          </label>
          <input 
            type="text" 
            id="college" 
            name="college"
            placeholder="e.g. Pace Institute of Technology and Sciences"
            class="w-full bg-[#0B0F17] border border-[#1F2937] rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none transition-smooth"
          />
          <p id="error-college" class="inline-error hidden text-xs text-red-400 mt-1.5" aria-live="polite"></p>
        </div>

        <!-- 3. Branch & Year (Grid) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="branch" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
              Branch <span class="text-red-400" aria-hidden="true">*</span>
            </label>
            <select 
              id="branch" 
              name="branch"
              class="w-full bg-[#0B0F17] border border-[#1F2937] rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none transition-smooth"
            >
              <option value="">Select your branch</option>
              <option value="CSE">CSE</option>
              <option value="IT">IT</option>
              <option value="ECE">ECE</option>
              <option value="Other">Other</option>
            </select>
            <p id="error-branch" class="inline-error hidden text-xs text-red-400 mt-1.5" aria-live="polite"></p>
          </div>

          <div>
            <label for="year" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
              Year of Study <span class="text-red-400" aria-hidden="true">*</span>
            </label>
            <select 
              id="year" 
              name="year"
              class="w-full bg-[#0B0F17] border border-[#1F2937] rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none transition-smooth"
            >
              <option value="">Select your year</option>
              <option value="2nd Year">2nd Year</option>
              <option value="3rd Year">3rd Year</option>
              <option value="4th Year">4th Year</option>
            </select>
            <p id="error-year" class="inline-error hidden text-xs text-red-400 mt-1.5" aria-live="polite"></p>
          </div>
        </div>

        <!-- 4. Target Role -->
        <div>
          <label for="targetRole" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
            Target Role <span class="text-red-400" aria-hidden="true">*</span>
          </label>
          <select 
            id="targetRole" 
            name="targetRole"
            class="w-full bg-[#0B0F17] border border-[#1F2937] rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none transition-smooth"
          >
            <option value="">Select target role</option>
            <option value="Web Developer">Web Developer</option>
            <option value="Mobile Developer (Flutter/Android)">Mobile Developer (Flutter/Android)</option>
            <option value="Backend Developer">Backend Developer</option>
            <option value="Data/AI">Data/AI</option>
            <option value="Not sure yet">Not sure yet</option>
          </select>
          <p id="error-targetRole" class="inline-error hidden text-xs text-red-400 mt-1.5" aria-live="polite"></p>
        </div>

        <!-- 5. Projects Completed & Main Language (Grid) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="projectCount" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
              Completed Projects <span class="text-red-400" aria-hidden="true">*</span>
            </label>
            <input 
              type="number" 
              id="projectCount" 
              name="projectCount"
              min="0"
              max="50"
              value="2"
              class="w-full bg-[#0B0F17] border border-[#1F2937] rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none transition-smooth"
            />
            <p class="text-[11px] text-slate-500 mt-1">Number between 0 and 50.</p>
            <p id="error-projectCount" class="inline-error hidden text-xs text-red-400 mt-1.5" aria-live="polite"></p>
          </div>

          <div>
            <label for="mainLanguage" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
              Main Coding Language <span class="text-red-400" aria-hidden="true">*</span>
            </label>
            <select 
              id="mainLanguage" 
              name="mainLanguage"
              class="w-full bg-[#0B0F17] border border-[#1F2937] rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none transition-smooth"
            >
              <option value="">Select language</option>
              <option value="Java">Java</option>
              <option value="Python">Python</option>
              <option value="C++">C++</option>
              <option value="C">C</option>
              <option value="JavaScript">JavaScript</option>
              <option value="Dart">Dart</option>
              <option value="Other">Other</option>
            </select>
            <p id="error-mainLanguage" class="inline-error hidden text-xs text-red-400 mt-1.5" aria-live="polite"></p>
          </div>
        </div>

        <!-- 6. Internship Status (Radio Group) -->
        <fieldset class="border-t border-[#1F2937] pt-4">
          <legend class="text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
            Have you completed at least one internship? <span class="text-red-400" aria-hidden="true">*</span>
          </legend>
          <div class="flex items-center space-x-6 text-sm">
            <label class="flex items-center gap-2 cursor-pointer">
              <input 
                type="radio" 
                id="internship-yes" 
                name="internship" 
                value="Yes"
                class="bg-[#0B0F17] border-[#1F2937] text-blue-600 focus:ring-blue-500"
              />
              <span class="text-slate-300">Yes</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input 
                type="radio" 
                id="internship-no" 
                name="internship" 
                value="No"
                class="bg-[#0B0F17] border-[#1F2937] text-blue-600 focus:ring-blue-500"
              />
              <span class="text-slate-300">No</span>
            </label>
          </div>
          <p id="error-internship" class="inline-error hidden text-xs text-red-400 mt-1.5" aria-live="polite"></p>
        </fieldset>

        <!-- Submit & Clear Controls -->
        <div class="border-t border-[#1F2937] pt-5 flex items-center justify-between">
          <button 
            type="button" 
            id="clear-profile-btn"
            class="hidden text-xs text-red-400 hover:text-red-300 transition-smooth px-3 py-2 rounded border border-red-500/20 hover:bg-red-500/10"
          >
            Clear profile
          </button>

          <button 
            type="submit" 
            class="ml-auto px-6 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm transition-smooth shadow-sm"
          >
            Save profile
          </button>
        </div>

      </form>

    </div>

  </main>

  <!-- Footer -->
  <footer class="border-t border-[#1F2937] py-6 text-center text-xs text-slate-500 space-y-1">
    <p>Practice tool, not a hiring guarantee.</p>
    <p class="text-slate-600">Built by a B.Tech student.</p>
  </footer>

  <!-- Scripts -->
  <script type="module" src="js/nav.js"></script>
  <script type="module" src="js/onboarding.js"></script>
</body>
</html>
